server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router routes (e.g. /food/<uuid>) aren't real files — fall back
    # to index.html so a direct navigation or refresh doesn't 404. Actual
    # static assets (js/css/images) still resolve to themselves first.
    location / {
        try_files $uri /index.html;
    }
}
